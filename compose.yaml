services:
    laravel.test:
        build:
            context: './docker/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            - pgsql
    pgsql:
        image: 'pgvector/pgvector:pg18'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './docker/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
            - './docker/pgsql/create-n8n-database.sql:/docker-entrypoint-initdb.d/20-create-n8n-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s
    n8n:
        image: 'n8nio/n8n:latest'
        restart: unless-stopped
        ports:
            - '${FORWARD_N8N_PORT:-5678}:5678'
        environment:
            N8N_PORT: 5678
            N8N_HOST: '${N8N_HOST:-localhost}'
            N8N_PROTOCOL: '${N8N_PROTOCOL:-http}'
            WEBHOOK_URL: '${N8N_WEBHOOK_URL:-http://localhost:5678/}'
            GENERIC_TIMEZONE: '${N8N_TIMEZONE:-America/Sao_Paulo}'
            TZ: '${N8N_TIMEZONE:-America/Sao_Paulo}'
            N8N_ENCRYPTION_KEY: '${N8N_ENCRYPTION_KEY:-please-change-this-encryption-key}'
            N8N_RUNNERS_ENABLED: 'true'
            N8N_DIAGNOSTICS_ENABLED: 'false'
            DB_TYPE: postgresdb
            DB_POSTGRESDB_HOST: pgsql
            DB_POSTGRESDB_PORT: 5432
            DB_POSTGRESDB_DATABASE: '${N8N_DB_DATABASE:-n8n}'
            DB_POSTGRESDB_USER: '${DB_USERNAME}'
            DB_POSTGRESDB_PASSWORD: '${DB_PASSWORD:-secret}'
            LANGCHAIN_TRACING_V2: 'true'
            LANGCHAIN_ENDPOINT: '${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}'
            LANGCHAIN_API_KEY: '${LANGSMITH_API_KEY}'
            LANGCHAIN_PROJECT: '${LANGSMITH_PROJECT:-condo-manager-local}'
            LANGCHAIN_CALLBACKS_BACKGROUND: 'true'
        volumes:
            - 'sail-n8n:/home/node/.n8n'
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
        extra_hosts:
            - 'host.docker.internal:host-gateway'
    redis:
        image: 'redis:7-alpine'
        restart: unless-stopped
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        command: 'redis-server --appendonly yes'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    sail-n8n:
        driver: local
    sail-redis:
        driver: local
